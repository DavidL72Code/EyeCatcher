# Installers for macOS, Windows and Linux, built on each system's own runner when a version tag is pushed
# (git tag v0.1.0 && git push origin v0.1.0), then put on one GitHub release. They're unsigned: the README says
# how to open them past macOS Gatekeeper and Windows SmartScreen.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # the voice runs on the CPU: onnxruntime-node would otherwise fetch its CUDA binaries on Linux
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64
          - os: macos-15-intel
            args: --mac --x64
          - os: windows-latest
            args: --win --x64
          - os: ubuntu-latest
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the version in the file names comes from the tag
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      # a .dmg that doesn't verify or open fails the build (build/check-dmg.cjs)
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # one installer per runner, its sum checked again in the release job so a file changed on its way isn't published
      - name: Record the installer's checksum
        shell: bash
        run: |
          shopt -s nullglob
          cd dist
          files=(*.dmg *.exe *.AppImage)
          if [ ${#files[@]} -ne 1 ]; then echo "::error::Expected one installer, found ${#files[@]}: ${files[*]}"; exit 1; fi
          if command -v sha256sum >/dev/null; then sha256sum "${files[@]}"; else shasum -a 256 "${files[@]}"; fi > "SHA256-${{ matrix.os }}.txt"
          cat "SHA256-${{ matrix.os }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/SHA256-*.txt
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # each runner's files in a folder of their own: v0.1.0's two Mac runners each built both DMGs, and their copies,
      # downloaded onto one path, published a corrupt arm64 DMG
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Check the installers arrived as built
        run: |
          mkdir installers
          for d in artifacts/*/; do
            (cd "$d" && sha256sum -c SHA256-*.txt)
            for f in "$d"*; do
              case "$f" in *.txt) continue ;; esac
              if [ -e "installers/$(basename "$f")" ]; then echo "::error::Two runners built $(basename "$f")"; exit 1; fi
              mv "$f" installers/
            done
            cat "$d"SHA256-*.txt >> installers/SHA256SUMS.txt
          done
          cat installers/SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la installers
          gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --title "Eye Catcher $GITHUB_REF_NAME" --generate-notes
