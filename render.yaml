# Thirdeye's backend on Render: a Node web service that holds the Gemini key (server/index.mjs). In Render, choose
# New > Blueprint and pick this repo, then set GEMINI_API_KEY when it asks; the key is never committed. The service's
# address then goes in desktop/config.json as "backend".
services:
  - type: web
    name: thirdeye-backend
    runtime: node
    plan: free
    # the backend has no dependencies; installing the app's dev tools (Electron, Playwright) would only slow deploys
    buildCommand: echo "No build step"
    startCommand: node server/index.mjs
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: NODE_VERSION
        value: "22"
      # the desktop app's page; add more origins, comma-separated, to let other builds of the app in
      - key: ALLOWED_ORIGINS
        value: http://127.0.0.1:5170
